name: GitHub-Profile-3D-Contrib

permissions:
  contents: write

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule: # Chạy tự động vào 18:00 UTC mỗi ngày (tương đương 01:00 sáng giờ Việt Nam)
    - cron: "0 18 * * *"
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          
      - name: Commit & Push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- profile-3d-contrib/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution chart"
          git push
